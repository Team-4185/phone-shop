services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${DB_NAME:-gadgetroom_dev}
      POSTGRES_USER: ${DB_USERNAME:-post}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-post}
    ports:
      - "${DB_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "${MINIO_STORAGE_PORT:-9000}:9000"
      - "${MINIO_STORAGE_WEB_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
