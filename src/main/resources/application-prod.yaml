server:
  port: ${PORT}
  shutdown: graceful

spring:
  config:
    import:
      optional:file:.env[.properties]
  application:
    name: gadgetroom
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      connection-timeout: 5000
      write-timeout: 5000
      timeout: 3000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000   # 1 min
      idle-timeout: 600000        # 10 min
      max-lifetime: 1800000       # 30 min
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}                    # domains or patterns
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    max-cache-age: ${CORS_MAX_CACHE_AGE}                        # seconds
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}

  frontend-url: ${FRONTEND_URL}

  cookies:
    secure: ${SECURE_COOKIES:true}

  rate-limit:
    enabled: true
    requests-per-window: ${AUTH_RATE_LIMIT_REQUESTS_PER_WINDOW:10}
    window: ${AUTH_RATE_LIMIT_WINDOW:1m}

  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    reset-secret: ${JWT_RESET_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
    remember-me-refresh-token-expiration: ${JWT_REMEMBER_ME_REFRESH_TOKEN_EXPIRATION}
    reset-token-expiration: ${JWT_RESET_TOKEN_EXPIRATION}

minio:
  url: ${MINIO_URL}
  username: ${MINIO_USERNAME}
  password: ${MINIO_PASSWORD}

payment:
  provider: ${PAYMENT_PROVIDER:mock}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:usd}

delivery:
  provider: ${DELIVERY_PROVIDER:mock}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
