spring:
  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      accept-float-as-int: false

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db,redis,minio
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health,info

security:
  cookies:
    secure: ${SECURE_COOKIES:false}
  rate-limit:
    enabled: true
    requests-per-window: ${AUTH_RATE_LIMIT_REQUESTS_PER_WINDOW:100}
    window: ${AUTH_RATE_LIMIT_WINDOW:1m}
